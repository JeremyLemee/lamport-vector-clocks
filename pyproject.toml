[project]
name = "logical-clock-visualizer"
version = "0.1.0"
description = "Interactive Lamport and vector clock timeline editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clock-server = "clock_visualizer.server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clock_visualizer"]
